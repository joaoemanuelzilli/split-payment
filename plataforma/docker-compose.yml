# Publicação num servidor próprio (VPS): aplicação + Postgres + HTTPS automático (Caddy) + backup diário.
# Uso: copie .env.example para .env, preencha DOMINIO e DB_SENHA e rode `docker compose up -d --build`.
# (Na Vercel com Supabase este arquivo não é usado.)
services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_SENHA:?defina DB_SENHA no arquivo .env}
    volumes:
      - pgdados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 10

  app:
    build: .
    image: caixa-split:latest
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://postgres:${DB_SENHA}@db:5432/postgres
      TRUSTED_PROXY_HOPS: "1"   # um proxy (o Caddy) na frente
    expose:
      - "3000"                  # só na rede interna do Docker; a porta aberta ao mundo é a do Caddy

  backup:
    image: postgres:17.6-alpine
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGPASSWORD: ${DB_SENHA}
    volumes:
      - backups:/backups
    # Uma cópia por dia, mantendo as 14 mais recentes
    command: ["sh", "-c", "while true; do pg_dump -h db -U postgres -Fc -f /backups/app-$$(date +%Y%m%d-%H%M%S).dump postgres && ls -1t /backups/app-*.dump | tail -n +15 | xargs -r rm -f; sleep 86400; done"]

  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO no arquivo .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dados:/data
      - caddy_config:/config

volumes:
  pgdados:
  backups:
  caddy_dados:
  caddy_config:
